<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Courses — Drix Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Admin<span>Management Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="/admin/dashboard" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
    <a href="/admin/fellows" class="sidebar-link"><span class="icon">👥</span> Fellows</a>
    <div class="sidebar-section-label">Content</div>
    <a href="/admin/courses" class="sidebar-link active"><span class="icon">📚</span> Courses</a>
    <a href="/admin/cohorts" class="sidebar-link"><span class="icon">🎓</span> Cohorts</a>
    <div class="sidebar-section-label">System</div>
    <a href="/admin/settings" class="sidebar-link"><span class="icon">⚙️</span> Settings</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="adminLogout()" class="btn btn-outline w-full btn-sm">← Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="flex-between mb-6">
    <div><h1 style="font-size:1.5rem;letter-spacing:-0.02em;">Courses</h1><p style="color:var(--muted);font-size:0.82rem;">Manage course content per track</p></div>
    <button class="btn btn-primary" onclick="openModal('courseModal')">+ Add Course</button>
  </div>

  <div class="card mb-4" style="padding:14px 20px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <select class="form-control" id="trackFilter" onchange="loadCourses()" style="max-width:220px;background:var(--bg3);"><option value="">All Tracks</option></select>
      <span id="courseCount" style="color:var(--muted);font-size:0.78rem;"></span>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Track</th><th>Type</th><th>Duration</th><th>Order</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody id="coursesTable"><tr><td colspan="7" style="text-align:center;padding:40px;"><span class="loader"></span></td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- COURSE MODAL -->
<div class="modal-overlay" id="courseModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="courseModalTitle">Add Course</div><button class="modal-close" onclick="closeModal('courseModal');resetCourse()">✕</button></div>
    <input type="hidden" id="editCourseId"/>
    <div class="form-group"><label class="form-label">Course Title *</label><input type="text" class="form-control" id="cTitle" placeholder="e.g. Introduction to Python"/></div>
    <div class="form-group"><label class="form-label">Track *</label><select class="form-control" id="cTrack"><option value="">Select track</option></select></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="cDesc" rows="3" placeholder="Course description..."></textarea></div>
    <div class="grid-2">
      <div class="form-group"><label class="form-label">Resource Type</label>
        <select class="form-control" id="cType"><option value="video">Video</option><option value="article">Article</option><option value="pdf">PDF</option><option value="quiz">Quiz</option><option value="project">Project</option></select>
      </div>
      <div class="form-group"><label class="form-label">Duration (minutes)</label><input type="number" class="form-control" id="cDuration" placeholder="60"/></div>
    </div>
    <div class="form-group"><label class="form-label">Content URL</label><input type="url" class="form-control" id="cUrl" placeholder="https://..."/></div>
    <div class="form-group"><label class="form-label">Order Index</label><input type="number" class="form-control" id="cOrder" placeholder="1"/></div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" onclick="saveCourse()">Save Course</button>
      <button class="btn btn-outline" onclick="closeModal('courseModal');resetCourse()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
async function loadTracks() {
  const tracks = await api.get('/api/admin/tracks');
  ['trackFilter','cTrack'].forEach(id => {
    const sel = document.getElementById(id);
    if (id === 'cTrack') sel.innerHTML = '<option value="">Select track</option>';
    tracks?.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = `${t.icon||''} ${t.name}`; sel.appendChild(o); });
  });
}

async function loadCourses() {
  const track = document.getElementById('trackFilter').value;
  const courses = await api.get(`/api/admin/courses${track ? '?track_id=' + track : ''}`);
  document.getElementById('courseCount').textContent = `${courses?.length || 0} courses`;
  const tb = document.getElementById('coursesTable');
  if (!courses?.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:40px;">No courses yet</td></tr>'; return; }
  tb.innerHTML = courses.map(c => `
    <tr>
      <td><div style="font-weight:600;font-size:0.84rem;">${c.title}</div>${c.content_url ? `<div style="margin-top:2px;"><a href="${c.content_url}" target="_blank" style="font-size:0.72rem;color:var(--accent2);">View resource →</a></div>` : ''}</td>
      <td style="font-size:0.82rem;">${c.tracks?.name || '—'}</td>
      <td><span class="badge badge-approved" style="font-size:0.66rem;">${c.resource_type}</span></td>
      <td style="font-size:0.82rem;">${c.duration_minutes} min</td>
      <td style="font-size:0.82rem;">${c.order_index}</td>
      <td><span style="color:${c.is_active ? 'var(--success)' : 'var(--danger);'};">${c.is_active ? '✓' : '✗'}</span></td>
      <td><div style="display:flex;gap:5px;">
        <button class="btn btn-outline btn-sm" onclick='editCourse(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="delCourse('${c.id}')">Del</button>
      </div></td>
    </tr>`).join('');
}

function editCourse(c) {
  document.getElementById('courseModalTitle').textContent = 'Edit Course';
  document.getElementById('editCourseId').value = c.id;
  document.getElementById('cTitle').value = c.title;
  document.getElementById('cTrack').value = c.track_id;
  document.getElementById('cDesc').value = c.description || '';
  document.getElementById('cType').value = c.resource_type;
  document.getElementById('cDuration').value = c.duration_minutes;
  document.getElementById('cUrl').value = c.content_url || '';
  document.getElementById('cOrder').value = c.order_index;
  openModal('courseModal');
}

function resetCourse() {
  document.getElementById('courseModalTitle').textContent = 'Add Course';
  document.getElementById('editCourseId').value = '';
  ['cTitle','cDesc','cUrl','cDuration','cOrder'].forEach(id => document.getElementById(id).value = '');
}

async function saveCourse() {
  const id = document.getElementById('editCourseId').value;
  const payload = { title: document.getElementById('cTitle').value, track_id: document.getElementById('cTrack').value, description: document.getElementById('cDesc').value, resource_type: document.getElementById('cType').value, duration_minutes: parseInt(document.getElementById('cDuration').value) || 60, content_url: document.getElementById('cUrl').value, order_index: parseInt(document.getElementById('cOrder').value) || 0 };
  if (!payload.title || !payload.track_id) { showToast('Title and track are required.', 'error'); return; }
  const r = id ? await api.put(`/api/admin/courses/${id}`, payload) : await api.post('/api/admin/courses', payload);
  if (r.success) { showToast(`Course ${id ? 'updated' : 'created'}!`, 'success'); closeModal('courseModal'); resetCourse(); loadCourses(); }
  else showToast(r.error || 'Failed.', 'error');
}

async function delCourse(id) {
  confirmAction('Delete this course?', async () => {
    const r = await api.delete(`/api/admin/courses/${id}`);
    if (r.success) { showToast('Deleted.', 'success'); loadCourses(); }
    else showToast('Failed.', 'error');
  });
}

loadTracks().then(() => loadCourses());
</script>
</body>
</html>
