<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Showcase — Drix Tech Talent</title>
<meta name="description" content="Capstone projects built by Drix Tech Talent fellows."/>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{padding-top:64px;}
.wrap{max-width:1100px;margin:0 auto;padding:60px 24px;}
.hero{text-align:center;margin-bottom:40px;}
.hero h1{font-size:2.2rem;font-weight:900;letter-spacing:-0.03em;margin-bottom:10px;}
.hero p{color:var(--muted);font-size:0.95rem;max-width:560px;margin:0 auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.proj{background:var(--surface);border:1px solid var(--border);border-radius:var(--rxl);padding:22px;display:flex;flex-direction:column;}
.proj-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.proj h3{font-size:1.02rem;font-weight:800;margin-bottom:6px;letter-spacing:-0.01em;}
.proj .desc{font-size:0.84rem;color:var(--text2);line-height:1.65;margin-bottom:14px;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.proj .links a{color:var(--brand-accent);font-size:0.8rem;margin-right:14px;font-weight:600;}
.grade-pill{display:inline-flex;padding:3px 12px;border-radius:50px;font-weight:700;font-size:0.7rem;margin-left:auto;}
.grade-pill.Distinction{background:rgba(6,214,160,0.14);color:#06D6A0;}
.grade-pill.Merit{background:rgba(124,110,247,0.14);color:var(--brand-secondary);}
.grade-pill.Pass{background:rgba(251,191,36,0.14);color:#FBBF24;}
.filter{display:flex;justify-content:center;margin-bottom:32px;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">DRIX<span> Tech Talent</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/blog">Blog</a>
    <a href="/login">Login</a>
    <a href="/register" class="btn btn-primary btn-sm">Apply Now</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <h1>Project Showcase</h1>
    <p>Real capstone projects built and approved by Drix Tech Talent fellows.</p>
  </div>
  <div class="filter"><select class="form-control" id="trackFilter" onchange="load()" style="max-width:260px;"><option value="">All tracks</option></select></div>
  <div class="grid" id="grid"><div class="flex-center" style="padding:60px;grid-column:1/-1;"><span class="loader"></span></div></div>
</div>

<footer style="border-top:1px solid var(--border);padding:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:0.76rem;color:var(--muted2);">
  <div>Drix Software Foundation © 2026</div>
  <div style="display:flex;gap:20px;"><a href="/terms" style="color:var(--muted);">Terms</a><a href="/privacy" style="color:var(--muted);">Privacy</a><a href="/contact" style="color:var(--muted);">Contact</a></div>
</footer>

<script src="/js/app.js"></script>
<script>
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// Only ever link out to http(s) — never a javascript: URL a fellow might have typed.
function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? esc(u) : ''; }

async function loadTracks() {
  try {
    const res = await fetch(API_BASE + '/api/fellows/tracks-public');
    const tracks = await res.json();
    const sel = document.getElementById('trackFilter');
    (tracks || []).forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
  } catch (e) {}
}

async function load() {
  const grid = document.getElementById('grid');
  const track = document.getElementById('trackFilter').value;
  try {
    const res = await fetch(`${API_BASE}/api/capstone/showcase${track ? `?track_id=${encodeURIComponent(track)}` : ''}`);
    const r = await res.json();
    const items = r.data || [];
    if (!items.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;padding:60px 20px;"><h3>No projects yet</h3><p>Approved capstone projects will appear here.</p></div>';
      return;
    }
    grid.innerHTML = items.map(p => {
      const links = [
        safeUrl(p.repo_url) ? `<a href="${safeUrl(p.repo_url)}" target="_blank" rel="noopener noreferrer">Code</a>` : '',
        safeUrl(p.live_url) ? `<a href="${safeUrl(p.live_url)}" target="_blank" rel="noopener noreferrer">View project</a>` : '',
        safeUrl(p.video_url) ? `<a href="${safeUrl(p.video_url)}" target="_blank" rel="noopener noreferrer">Video</a>` : '',
      ].join('');
      return `
      <div class="proj">
        <div class="proj-top">
          <div class="avatar">${p.fellows?.profile_photo ? `<img src="${p.fellows.profile_photo}" alt=""/>` : esc(p.fellows?.full_name?.charAt(0) || '?')}</div>
          <div><div style="font-weight:700;font-size:0.86rem;">${esc(p.fellows?.full_name)}</div><div style="font-size:0.72rem;color:var(--muted);">${esc(p.tracks?.name)}</div></div>
          ${p.grade ? `<span class="grade-pill ${esc(p.grade)}">${esc(p.grade)}</span>` : ''}
        </div>
        <h3>${esc(p.title)}</h3>
        <div class="desc">${esc(p.description || '')}</div>
        <div class="links">${links}</div>
      </div>`;
    }).join('');
  } catch (e) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>Could not load projects right now.</p></div>';
  }
}

loadTracks();
load();
</script>
</body>
</html>
