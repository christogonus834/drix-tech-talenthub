<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden;}
/* EDIT: change this Unsplash URL for admin login background */
.abg{position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1400&q=80') center/cover no-repeat;}
.abg-ov{position:fixed;inset:0;z-index:1;background:rgba(11,12,16,0.92);}
.wrap{position:relative;z-index:2;width:100%;max-width:420px;padding:20px;}
.card{background:rgba(30,31,41,0.9);backdrop-filter:blur(28px);border:1px solid var(--border2);border-radius:var(--rl);padding:44px;box-shadow:0 24px 64px rgba(0,0,0,0.5);}
.admin-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:50px;background:rgba(124,110,247,0.12);border:1px solid rgba(124,110,247,0.28);color:var(--accent2);font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:18px;}
</style>
</head>
<body>
<div class="abg"></div>
<div class="abg-ov"></div>
<div class="wrap">
  <div style="text-align:center;margin-bottom:24px;">
    <a href="/" style="font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">DRIX Tech Talent</a>
  </div>
  <div class="card">
    <div class="admin-tag">🛡️ Admin Access</div>
    <h2 style="font-size:1.45rem;margin-bottom:5px;">Admin Portal</h2>
    <p style="color:var(--muted);font-size:0.84rem;margin-bottom:26px;">Restricted access. Authorised personnel only.</p>
    <div id="alertBox" class="alert"></div>
    <form id="adminLoginForm">
      <div class="form-group"><label class="form-label">Admin Email</label><input type="email" class="form-control" id="email" placeholder="admin@drixtechtalent.com" required/></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" id="password" placeholder="Admin password" required/></div>
      <button type="submit" class="btn btn-primary w-full" id="loginBtn" style="margin-top:6px;">Access Admin Panel</button>
    </form>
    <p style="text-align:center;margin-top:20px;"><a href="/login" style="font-size:0.78rem;color:var(--muted2);">← Fellow login</a></p>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Authenticating...';
  const box = document.getElementById('alertBox');
  const result = await api.post('/api/auth/admin/login', {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });
  if (result.success) { window.location.href = result.redirect || '/admin/dashboard'; }
  else {
    box.className = 'alert alert-error show'; box.textContent = result.error || 'Invalid credentials.';
    btn.disabled = false; btn.textContent = 'Access Admin Panel';
  }
});
</script>
</body>
</html>
