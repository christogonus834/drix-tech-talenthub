<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Certificates — Drix Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.tab-bar{display:flex;gap:6px;margin-bottom:24px;background:var(--bg3);padding:5px;border-radius:var(--r);width:fit-content;}
.tab-btn{padding:8px 22px;border-radius:calc(var(--r) - 2px);border:none;background:transparent;color:var(--muted);font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:var(--font);}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.cert-table{width:100%;border-collapse:collapse;}
.cert-table th{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted2);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
.cert-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:0.83rem;vertical-align:middle;}
.cert-table tr:last-child td{border-bottom:none;}
.cert-table tr:hover td{background:var(--bg3);}
.av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;overflow:hidden;flex-shrink:0;}
.av img{width:100%;height:100%;object-fit:cover;}
.badge-pending{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.25);padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:600;}
.badge-approved{background:rgba(6,214,160,0.12);color:#06d6a0;border:1px solid rgba(6,214,160,0.2);padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:600;}
.badge-rejected{background:rgba(244,63,94,0.1);color:#f43f5e;border:1px solid rgba(244,63,94,0.15);padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:600;}
.badge-issued{background:rgba(124,110,247,0.12);color:var(--accent2);border:1px solid rgba(124,110,247,0.2);padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:600;}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Admin<span>Management Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="/admin/dashboard" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
    <a href="/admin/fellows" class="sidebar-link"><span class="icon">👥</span> Fellows</a>
    <div class="sidebar-section-label">Content</div>
    <a href="/admin/courses" class="sidebar-link"><span class="icon">📚</span> Courses</a>
    <a href="/admin/cohorts" class="sidebar-link"><span class="icon">🎓</span> Cohorts</a>
    <div class="sidebar-section-label">System</div>
    <a href="/admin/settings" class="sidebar-link"><span class="icon">⚙️</span> Settings</a>
    <a href="/admin/certificates" class="sidebar-link active"><span class="icon">📜</span> Certificates</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="adminLogout()" class="btn btn-outline w-full btn-sm">← Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="flex-between mb-6">
    <div><h1 style="font-size:1.5rem;letter-spacing:-0.02em;">Certificates</h1><p style="color:var(--muted);font-size:0.82rem;">Manage issued certificates and fellow requests</p></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('requests')">📥 Requests <span id="reqBadge" style="display:none;background:var(--accent);color:white;border-radius:50px;padding:1px 7px;font-size:0.66rem;margin-left:4px;"></span></button>
    <button class="tab-btn" onclick="showTab('issued')">📜 All Issued</button>
  </div>

  <!-- REQUESTS TAB -->
  <div id="tab-requests">
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="requestsTable"><div style="padding:40px;text-align:center;"><span class="loader"></span></div></div>
    </div>
  </div>

  <!-- ISSUED TAB -->
  <div id="tab-issued" style="display:none;">
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="issuedTable"><div style="padding:40px;text-align:center;"><span class="loader"></span></div></div>
    </div>
  </div>
</main>

<!-- Approve modal -->
<div class="modal-overlay" id="approveModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><div class="modal-title">✅ Approve Certificate</div><button class="modal-close" onclick="closeModal('approveModal')">✕</button></div>
    <input type="hidden" id="approveReqId"/>
    <div class="form-group"><label class="form-label">Certificate Title</label><input type="text" class="form-control" id="approveTitle" placeholder="Certificate of Completion"/></div>
    <div class="form-group" style="margin-bottom:20px;"><label class="form-label">Grade</label><input type="text" class="form-control" id="approveGrade" placeholder="Pass / Merit / Distinction"/></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="confirmApprove()">✅ Issue Certificate</button>
      <button class="btn btn-outline" onclick="closeModal('approveModal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Reject modal -->
<div class="modal-overlay" id="rejectModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header"><div class="modal-title">❌ Reject Request</div><button class="modal-close" onclick="closeModal('rejectModal')">✕</button></div>
    <input type="hidden" id="rejectReqId"/>
    <div class="form-group" style="margin-bottom:20px;"><label class="form-label">Reason (sent to fellow)</label><input type="text" class="form-control" id="rejectReason" placeholder="e.g. Incomplete coursework"/></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-danger" onclick="confirmReject()">❌ Reject</button>
      <button class="btn btn-outline" onclick="closeModal('rejectModal')">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
// ── ADMIN TOKEN GUARD ─────────────────────────────────────────────
if (!localStorage.getItem('drix_admin_token')) {
  window.location.href = '/admin/login';
}

</script>
<script>
function showTab(tab) {
  document.getElementById('tab-requests').style.display = tab === 'requests' ? 'block' : 'none';
  document.getElementById('tab-issued').style.display = tab === 'issued' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0 && tab === 'requests') || (i === 1 && tab === 'issued')));
  if (tab === 'issued') loadIssued();
}

async function loadRequests() {
  const data = await api.get('/api/admin/certificates/requests/all', true);
  const pending = data?.filter(r => r.status === 'pending') || [];
  const badge = document.getElementById('reqBadge');
  if (pending.length) { badge.style.display = 'inline'; badge.textContent = pending.length; }

  document.getElementById('requestsTable').innerHTML = !data?.length
    ? '<div style="padding:40px;text-align:center;color:var(--muted);">No certificate requests yet</div>'
    : `<table class="cert-table">
        <thead><tr>
          <th>Fellow</th><th>ID</th><th>Track</th><th>Requested</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>${data.map(r => `
          <tr>
            <td><div style="display:flex;align-items:center;gap:10px;">
              <div class="av">${r.fellows?.profile_photo ? `<img src="${r.fellows.profile_photo}"/>` : (r.fellows?.full_name?.charAt(0) || '?')}</div>
              <div style="font-weight:600;">${r.fellows?.full_name || '—'}</div>
            </div></td>
            <td style="font-family:monospace;font-size:0.78rem;color:var(--accent2);">${r.fellows?.fellow_id || '—'}</td>
            <td>${r.tracks?.icon || ''} ${r.tracks?.name || r.fellows?.tracks?.name || '—'}</td>
            <td style="color:var(--muted);">${formatDate(r.requested_at)}</td>
            <td><span class="badge-${r.status}">${r.status}</span></td>
            <td>
              ${r.status === 'pending' ? `
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-sm" style="background:rgba(6,214,160,0.12);color:var(--success);border:1px solid rgba(6,214,160,0.2);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-family:var(--font);font-size:0.76rem;" onclick="openApprove('${r.id}')">✅ Approve</button>
                  <button class="btn btn-sm" style="background:rgba(244,63,94,0.1);color:var(--danger);border:1px solid rgba(244,63,94,0.15);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-family:var(--font);font-size:0.76rem;" onclick="openReject('${r.id}')">❌ Reject</button>
                </div>` : `<span style="color:var(--muted);font-size:0.78rem;">${r.status === 'rejected' ? '— ' + (r.reject_reason || '') : 'Issued'}</span>`}
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
}

async function loadIssued() {
  const data = await api.get('/api/admin/certificates/all', true);
  document.getElementById('issuedTable').innerHTML = !data?.length
    ? '<div style="padding:40px;text-align:center;color:var(--muted);">No certificates issued yet</div>'
    : `<table class="cert-table">
        <thead><tr>
          <th>Fellow</th><th>Certificate ID</th><th>Track</th><th>Grade</th><th>Type</th><th>Issued</th><th></th>
        </tr></thead>
        <tbody>${data.map(c => `
          <tr>
            <td><div style="display:flex;align-items:center;gap:10px;">
              <div class="av">${c.fellows?.profile_photo ? `<img src="${c.fellows.profile_photo}"/>` : (c.fellows?.full_name?.charAt(0) || '?')}</div>
              <div><div style="font-weight:600;">${c.fellows?.full_name || '—'}</div><div style="font-size:0.72rem;color:var(--muted);">${c.fellows?.fellow_id || ''}</div></div>
            </div></td>
            <td style="font-family:monospace;font-size:0.78rem;color:var(--accent2);">${c.certificate_id}</td>
            <td>${c.tracks?.icon || ''} ${c.tracks?.name || '—'}</td>
            <td><span class="badge-issued">${c.grade || 'Pass'}</span></td>
            <td style="color:var(--muted);font-size:0.78rem;">${c.issued_manually ? '👤 Manual' : '⚙️ Auto'}</td>
            <td style="color:var(--muted);">${formatDate(c.issued_at)}</td>
            <td><button class="btn btn-outline btn-sm" onclick="revokeCert('${c.id}')">Revoke</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
}

function openApprove(id) {
  document.getElementById('approveReqId').value = id;
  document.getElementById('approveTitle').value = '';
  document.getElementById('approveGrade').value = '';
  openModal('approveModal');
}
function openReject(id) {
  document.getElementById('rejectReqId').value = id;
  document.getElementById('rejectReason').value = '';
  openModal('rejectModal');
}

async function confirmApprove() {
  const id = document.getElementById('approveReqId').value;
  const r = await api.post(`/api/admin/certificates/requests/${id}/approve`, {
    title: document.getElementById('approveTitle').value,
    grade: document.getElementById('approveGrade').value,
  });
  if (r?.success) { showToast(`✅ Certificate issued! ID: ${r.certificate_id}`, 'success'); closeModal('approveModal'); loadRequests(); }
  else showToast(r?.error || 'Failed.', 'error');
}

async function confirmReject() {
  const id = document.getElementById('rejectReqId').value;
  const r = await api.post(`/api/admin/certificates/requests/${id}/reject`, {
    reason: document.getElementById('rejectReason').value,
  });
  if (r?.success) { showToast('Request rejected.', 'info'); closeModal('rejectModal'); loadRequests(); }
  else showToast(r?.error || 'Failed.', 'error');
}

async function revokeCert(id) {
  confirmAction('Revoke this certificate? This cannot be undone.', async () => {
    const r = await api.delete(`/api/admin/certificates/${id}`, true);
    if (r?.success) { showToast('Certificate revoked.', 'info'); loadIssued(); }
    else showToast('Failed.', 'error');
  });
}

loadRequests();
</script>
</body>
</html>
