<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — Drix Admin</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
.post-cover-thumb{width:64px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface2);flex-shrink:0;}
.post-title-cell{display:flex;align-items:center;gap:12px;}
.cover-drop{border:1.5px dashed var(--border3);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:var(--trans);}
.cover-drop:hover{border-color:var(--brand-primary);}
.cover-preview{width:100%;max-height:160px;object-fit:cover;border-radius:var(--r);margin-top:10px;display:none;}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="sidebar-logo">DRIX Admin<span>Management Portal</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Overview</div>
    <a href="/admin/dashboard" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Dashboard</a>
    <a href="/admin/fellows" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>Fellows</a>
    <div class="sidebar-section-label">Content</div>
    <a href="/admin/courses" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Tracks & Modules</a>
    <a href="/admin/cohorts" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Cohorts</a>
    <a href="/admin/certificates" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg></span>Certificates</a>
    <a href="/admin/blog" class="sidebar-link active"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>Blog</a>
    <a href="/admin/messages" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>Messages</a>
    <div class="sidebar-section-label">System</div>
    <a href="/admin/settings" class="sidebar-link"><span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></span>Settings</a>
  </nav>
  <div class="sidebar-bottom"><button onclick="adminLogout()" class="btn btn-outline w-full btn-sm">Sign Out</button></div>
</aside>

<main class="main-content">
  <div class="flex-between mb-6">
    <div><h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;">Blog</h1><p style="color:var(--muted);font-size:0.82rem;margin-top:3px;">Write, publish and manage blog posts</p></div>
    <button class="btn btn-primary" onclick="openNewPost()">
      <span class="icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      New Post
    </button>
  </div>

  <div class="card" style="padding:0;overflow:hidden;">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Post</th><th>Tag</th><th>Status</th><th>Published</th><th></th></tr></thead>
        <tbody id="postsTable"><tr><td colspan="5"><div class="flex-center" style="padding:40px;"><span class="loader"></span></div></td></tr></tbody>
      </table>
    </div>
  </div>
</main>
</div>

<!-- POST EDITOR MODAL -->
<div class="modal-overlay" id="postModal">
  <div class="modal" style="max-width:640px;max-height:88vh;overflow-y:auto;">
    <div class="modal-header"><div class="modal-title" id="postModalTitle">New Post</div><button class="modal-close" onclick="closeModal('postModal')">✕</button></div>
    <input type="hidden" id="postId"/>

    <div class="form-group"><label class="form-label">Title *</label><input type="text" class="form-control" id="postTitle" placeholder="e.g. Top 5 Tech Skills in Demand" oninput="autoSlug()"/></div>
    <div class="form-group"><label class="form-label">URL Slug</label><input type="text" class="form-control" id="postSlug" placeholder="auto-generated-from-title"/></div>
    <div class="form-group"><label class="form-label">Excerpt (shown on blog listing card)</label><textarea class="form-control" id="postExcerpt" rows="2" placeholder="One or two sentence summary..."></textarea></div>

    <div class="grid-2">
      <div class="form-group"><label class="form-label">Tag</label>
        <select class="form-control" id="postTag">
          <option>Getting Started</option><option>Career</option><option>Partnership</option>
          <option>Cybersecurity</option><option>Certificates</option><option>Announcement</option>
          <option>General</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Read Time (mins)</label><input type="number" class="form-control" id="postReadMins" value="5" min="1"/></div>
    </div>

    <div class="form-group"><label class="form-label">Author</label><input type="text" class="form-control" id="postAuthor" value="Drix Team"/></div>

    <div class="form-group">
      <label class="form-label">Cover Image</label>
      <div class="cover-drop" id="coverDrop" onclick="document.getElementById('coverInput').click()">
        <span style="font-size:0.8rem;color:var(--muted);">Click to upload a cover image</span>
        <input type="file" id="coverInput" accept="image/*" style="display:none;"/>
      </div>
      <img id="coverPreview" class="cover-preview"/>
      <input type="hidden" id="postCoverUrl"/>
    </div>

    <div class="form-group">
      <label class="form-label">Content (Markdown supported — # heading, **bold**, *italic*, - list, [link](url))</label>
      <textarea class="form-control" id="postContent" rows="12" placeholder="Write your post here using Markdown..." style="font-family:monospace;font-size:0.82rem;"></textarea>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <label class="toggle"><input type="checkbox" id="postPublished"/><span class="toggle-slider"></span></label>
      <span style="font-size:0.82rem;color:var(--muted);">Publish immediately (uncheck to save as draft)</span>
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="savePostBtn" onclick="savePost()">Save Post</button>
      <button class="btn btn-outline" onclick="closeModal('postModal')">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (!auth.getAdminToken()) window.location.href = '/admin/login';

let slugTouched = false;
let allPosts = [];

function slugify(str) {
  return (str || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}
function autoSlug() {
  if (slugTouched) return;
  document.getElementById('postSlug').value = slugify(document.getElementById('postTitle').value);
}
document.getElementById('postSlug').addEventListener('input', () => { slugTouched = true; });

function formatDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

async function loadPosts() {
  const data = await api.get('/api/blog/admin/all', true);
  allPosts = data || [];
  const tbody = document.getElementById('postsTable');
  if (!allPosts.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted);font-size:0.84rem;">No posts yet. Click "New Post" to write your first one.</td></tr>`;
    return;
  }
  tbody.innerHTML = allPosts.map(p => `
    <tr>
      <td>
        <div class="post-title-cell">
          ${p.cover_image_url ? `<img src="${p.cover_image_url}" class="post-cover-thumb"/>` : `<div class="post-cover-thumb"></div>`}
          <div>
            <div style="font-weight:600;">${p.title}</div>
            <div style="font-size:0.7rem;color:var(--muted2);">/blog/${p.slug}</div>
          </div>
        </div>
      </td>
      <td><span class="badge badge-info">${p.tag}</span></td>
      <td><span class="badge ${p.status === 'published' ? 'badge-approved' : 'badge-pending'}">${p.status}</span></td>
      <td style="font-size:0.78rem;color:var(--muted);">${formatDate(p.published_at)}</td>
      <td>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn btn-outline btn-sm" onclick="togglePublish('${p.id}','${p.status}')">${p.status === 'published' ? 'Unpublish' : 'Publish'}</button>
          <button class="btn btn-outline btn-sm" onclick="openEditPost('${p.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join('');
}

function resetPostForm() {
  slugTouched = false;
  document.getElementById('postId').value = '';
  document.getElementById('postTitle').value = '';
  document.getElementById('postSlug').value = '';
  document.getElementById('postExcerpt').value = '';
  document.getElementById('postTag').value = 'General';
  document.getElementById('postReadMins').value = '5';
  document.getElementById('postAuthor').value = 'Drix Team';
  document.getElementById('postCoverUrl').value = '';
  document.getElementById('postContent').value = '';
  document.getElementById('postPublished').checked = false;
  document.getElementById('coverPreview').style.display = 'none';
  document.getElementById('coverPreview').src = '';
  document.getElementById('savePostBtn').disabled = false;
  document.getElementById('savePostBtn').textContent = 'Save Post';
}

function openNewPost() {
  resetPostForm();
  document.getElementById('postModalTitle').textContent = 'New Post';
  openModal('postModal');
}

function openEditPost(id) {
  const p = allPosts.find(x => x.id === id);
  if (!p) return;
  resetPostForm();
  slugTouched = true; // don't auto-overwrite an existing slug while editing
  document.getElementById('postModalTitle').textContent = 'Edit Post';
  document.getElementById('postId').value = p.id;
  document.getElementById('postTitle').value = p.title;
  document.getElementById('postSlug').value = p.slug;
  document.getElementById('postExcerpt').value = p.excerpt || '';
  document.getElementById('postTag').value = p.tag || 'General';
  document.getElementById('postReadMins').value = p.read_minutes || 5;
  document.getElementById('postAuthor').value = p.author_name || 'Drix Team';
  document.getElementById('postCoverUrl').value = p.cover_image_url || '';
  document.getElementById('postContent').value = p.content || '';
  document.getElementById('postPublished').checked = p.status === 'published';
  if (p.cover_image_url) {
    document.getElementById('coverPreview').src = p.cover_image_url;
    document.getElementById('coverPreview').style.display = 'block';
  }
  openModal('postModal');
}

document.getElementById('coverInput').addEventListener('change', async () => {
  const file = document.getElementById('coverInput').files[0];
  if (!file) return;
  const drop = document.getElementById('coverDrop');
  drop.querySelector('span').textContent = 'Uploading...';
  const fd = new FormData();
  fd.append('image', file);
  const result = await api.upload('/api/upload/image', fd, true);
  if (result?.success) {
    document.getElementById('postCoverUrl').value = result.url;
    document.getElementById('coverPreview').src = result.url;
    document.getElementById('coverPreview').style.display = 'block';
    drop.querySelector('span').textContent = 'Click to change cover image';
  } else {
    drop.querySelector('span').textContent = 'Upload failed — click to retry';
  }
});

async function savePost() {
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  if (!title) return showToast('Title is required', 'error');
  if (!content) return showToast('Content is required', 'error');

  const id = document.getElementById('postId').value;
  const payload = {
    title,
    slug: document.getElementById('postSlug').value.trim() || undefined,
    excerpt: document.getElementById('postExcerpt').value.trim(),
    content,
    cover_image_url: document.getElementById('postCoverUrl').value || null,
    tag: document.getElementById('postTag').value,
    author_name: document.getElementById('postAuthor').value.trim() || 'Drix Team',
    read_minutes: parseInt(document.getElementById('postReadMins').value) || 5,
    status: document.getElementById('postPublished').checked ? 'published' : 'draft'
  };

  const btn = document.getElementById('savePostBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Saving...';

  const r = id
    ? await api.patch(`/api/blog/admin/${id}`, payload, true)
    : await api.post('/api/blog/admin', payload, true);

  if (r?.success) {
    showToast(id ? 'Post updated!' : 'Post created!', 'success');
    closeModal('postModal');
    loadPosts();
  } else {
    showToast(r?.error || 'Failed to save post — check Render logs', 'error');
    btn.disabled = false;
    btn.textContent = 'Save Post';
  }
}

async function togglePublish(id, currentStatus) {
  const newStatus = currentStatus === 'published' ? 'draft' : 'published';
  const r = await api.patch(`/api/blog/admin/${id}`, { status: newStatus }, true);
  if (r?.success) { showToast(newStatus === 'published' ? 'Post published!' : 'Post unpublished.', 'success'); loadPosts(); }
  else showToast(r?.error || 'Failed', 'error');
}

async function deletePost(id) {
  confirmAction('Delete this post permanently?', async () => {
    const r = await api.delete(`/api/blog/admin/${id}`, true);
    if (r?.success) { showToast('Post deleted', 'info'); loadPosts(); }
    else showToast(r?.error || 'Failed', 'error');
  });
}

loadPosts();
</script>
</body>
</html>
