<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog — Drix Tech Talent</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{padding-top:64px;}
.blog-wrap{max-width:1100px;margin:0 auto;padding:60px 24px;}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}
.blog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:var(--trans);cursor:pointer;}
.blog-card:hover{border-color:var(--border3);transform:translateY(-4px);box-shadow:var(--glow);}
.blog-img{width:100%;height:180px;object-fit:cover;background:var(--surface2);display:flex;align-items:center;justify-content:center;}
.blog-body{padding:20px;}
.blog-tag{display:inline-block;padding:3px 10px;border-radius:50px;font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;background:rgba(124,110,247,0.1);color:var(--brand-secondary);}
.blog-title{font-size:0.98rem;font-weight:700;line-height:1.4;margin-bottom:8px;letter-spacing:-0.01em;}
.blog-excerpt{font-size:0.8rem;color:var(--muted);line-height:1.7;margin-bottom:14px;}
.blog-meta{display:flex;align-items:center;gap:10px;font-size:0.72rem;color:var(--muted2);}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">DRIX<span> Tech Talent</span></a>
  <div class="nav-links">
    <a href="/">Home</a><a href="/blog" style="color:var(--text);">Blog</a>
    <a href="/contact">Contact</a>
    <a href="/login">Login</a>
    <a href="/register" class="btn btn-primary btn-sm">Apply Now</a>
  </div>
</nav>

<div class="blog-wrap">
  <div style="margin-bottom:48px;">
    <div class="section-tag">Insights & Updates</div>
    <h1 style="font-size:2rem;font-weight:900;letter-spacing:-0.03em;margin-top:12px;margin-bottom:10px;">Drix Tech Blog</h1>
    <p style="color:var(--muted);font-size:0.92rem;">Tech insights, programme updates, and career advice for Nigerian tech talent.</p>
  </div>

  <div class="blog-grid" id="blogGrid">
    <div class="flex-center" style="padding:60px;grid-column:1/-1;"><span class="loader"></span></div>
  </div>
</div>

<footer style="border-top:1px solid var(--border);padding:24px 56px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:0.8rem;flex-wrap:wrap;gap:12px;margin-top:60px;">
  <div>Drix Software Foundation © 2026 · Sponsored by ePayBillz Telecomm</div>
  <div style="display:flex;gap:20px;"><a href="/terms" style="color:var(--muted);">Terms</a><a href="/contact" style="color:var(--muted);">Contact</a><a href="/verify" style="color:var(--muted);">Verify Certificate</a></div>
</footer>

<script src="/js/app.js"></script>
<script>
function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadBlog() {
  const grid = document.getElementById('blogGrid');
  try {
    const res = await fetch(API_BASE + '/api/blog');
    const posts = await res.json();

    if (!Array.isArray(posts) || !posts.length) {
      grid.innerHTML = `
        <div class="flex-center" style="padding:60px;grid-column:1/-1;flex-direction:column;gap:10px;color:var(--muted);">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <p style="font-size:0.88rem;">No posts published yet. Check back soon!</p>
        </div>`;
      return;
    }

    grid.innerHTML = posts.map(p => `
      <div class="blog-card" onclick="window.location.href='/blog/${p.slug}'">
        <div class="blog-img" style="${p.cover_image_url ? `background-image:url('${p.cover_image_url}');background-size:cover;background-position:center;` : 'background:linear-gradient(135deg,rgba(124,110,247,0.2),rgba(6,214,160,0.1));'}">
          ${!p.cover_image_url ? `<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="1.5" opacity="0.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>` : ''}
        </div>
        <div class="blog-body">
          <div class="blog-tag">${escapeHtml(p.tag)}</div>
          <div class="blog-title">${escapeHtml(p.title)}</div>
          <div class="blog-excerpt">${escapeHtml(p.excerpt || '')}</div>
          <div class="blog-meta">
            <span>${escapeHtml(p.author_name)}</span><span>·</span><span>${formatDate(p.published_at)}</span><span>·</span><span>${p.read_minutes || 5} min read</span>
          </div>
        </div>
      </div>`).join('');
  } catch (e) {
    grid.innerHTML = `<div style="padding:40px;grid-column:1/-1;text-align:center;color:var(--muted);">Failed to load posts. Please try again later.</div>`;
  }
}

loadBlog();
</script>
</body>
</html>
